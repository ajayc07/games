<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6ec6ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Athi" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Athi's Game</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #6ec6ff;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
      }
      /* Canvas runs edge to edge (D-013); UI keeps clear of notches via core/ui/layout.ts. */
      #game {
        position: absolute;
        inset: 0;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      /* Friendly "please rotate" picture, no text. Shown only in portrait. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #6ec6ff;
        align-items: center;
        justify-content: center;
      }
      #rotate svg {
        width: min(60vw, 60vh);
        height: auto;
      }
      #rotate .phone {
        transform-origin: 100px 100px;
        animation: turn 2.4s ease-in-out infinite;
      }
      @keyframes turn {
        0%,
        25% {
          transform: rotate(0deg);
        }
        55%,
        100% {
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-hidden="true">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M40 150 A70 70 0 0 1 40 50" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" />
        <path d="M28 62 L40 46 L56 58" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <g class="phone">
          <rect x="72" y="45" width="56" height="110" rx="12" fill="#ffd54f" stroke="#fff" stroke-width="6" />
          <circle cx="100" cy="140" r="6" fill="#fff" />
        </g>
      </svg>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
